# Configurazione del sistema di pubblicazione AXUX + VOLWICK
# Regole complete: documento "sistema-pubblicazione-axux-volwick.md" nel Project AXUX.
# Gli ID sono quelli di Blotato (pagina Accounts). null = account non ancora collegato: i post per lui vengono saltati.

require_confirmation: true  # pubblica solo i pacchetti con dentro il file CONFERMATO.txt (messo dalla chat quando Power scrive "confermato")
drive:                     # Google Drive: "SOCIAL PUBLISHER" (Il mio Drive di sellam.work)
  inbox_folder_id: 1SQT2nBorOoHobC-KUrWNhBy1XcoYiZIe       # SOCIAL PUBLISHER/DA MANDARE
  published_folder_id: 12CnX3Bq3sp_ChrmGFJHDBKj7wue3T-Y_   # SOCIAL PUBLISHER/PUBBLICATI
  sheet_id: 1beKkZYeMqay39GFeypYoE4CZ1pL-fIA3mK8g7fWui9A   # SOCIAL PUBLISHER · Cruscotto (primo foglio)
lookahead_days: 2          # programma i pacchetti di oggi e dei prossimi 2 giorni
package_timezone: Europe/Rome   # fuso usato per leggere la data nel nome della cartella
late_publish_minutes: 10   # se uno slot è già passato, pubblica tra 10 minuti
late_max_minutes: 120      # ma solo se è passato da meno di 2 ore: oltre non esce, il portale lo rimette nel primo posto libero (Power, 25/11 03:07)

defaults:
  tiktok:
    privacyLevel: PUBLIC_TO_EVERYONE
    disabledComments: false
    disabledDuet: false
    disabledStitch: false
    isBrandedContent: false
    isYourBrand: true
    isAiGenerated: true       # voci/immagini AI: TikTok chiede di dichiararlo
    autoAddMusic: false
  youtube:
    privacyStatus: public
    shouldNotifySubscribers: true
    isMadeForKids: false
    containsSyntheticMedia: true
  instagram:
    shareToFeed: true

# Ogni giorno per brand 3 reel (reel1, reel2, reel3) e 1 carosello (Power, 24/11/2026: «3 reel ed 1 carosello al giorno da
# riempire sempre»). Dove va ogni lingua: plan.py, TARGETS (dal 26/11: IT = Instagram italiano + TikTok, EN = Instagram USA
# + YouTube). «dal» = l'account pubblica solo i pacchetti da quel giorno; i pacchetti già programmati di quei giorni ricevono
# da soli i post nuovi. Gli orari di Instagram Italia sono anche nel motore del portale (studio-hub, runner.mjs, ORARI_IT): se li
# cambi qui, cambiali anche lì.
brands:
  AXUX:
    accounts:
      ig_it:
        platform: instagram
        blotato_id: "87313"        # @axux.ita
        nome: "@axux.ita"
        timezone: Europe/Rome
        slots: {reel1: "14:00", carosello: "17:00", reel2: "19:00", reel3: "21:00", storia1: "10:00", storia2: "16:00", storia3: "19:30"}
      ig_us:
        platform: instagram
        dal: "2026-11-26"          # Power, 25/11 00:15: Instagram USA riparte con l'inglese che approva, dalle uscite del 26 novembre (prima: in pausa dal 23/11)
        blotato_id: "88313"        # @axux.officiall (Instagram USA, AdsPower)
        nome: "@axux.officiall"
        timezone: America/New_York
        slots: {carosello: "09:00", reel1: "12:00", reel2: "18:00", reel3: "21:00", storia1: "08:30", storia2: "13:30", storia3: "20:00"}
      tiktok:
        platform: tiktok
        dal: "2026-11-26"          # Power, 25/11 00:15: «i tik tok italiani vanno usati per lingua ita per ora»: contenuti italiani, dal 26 novembre
        blotato_id: "70653"        # @axux.official (TikTok, per ora in italiano)
        nome: "TikTok @axux.official"
        timezone: Europe/Rome
        slots: {reel1: "14:00", carosello: "17:00", reel2: "19:00", reel3: "21:00"}   # come Instagram Italia
      youtube:
        platform: youtube
        blotato_id: "58952"        # Media axux (Axux)
        nome: "YouTube Media axux"
        timezone: America/New_York
        slots: {short1: "14:00", short2: "19:00", short3: "21:00"}

  VOLWICK:
    accounts:
      ig_it:
        platform: instagram
        blotato_id: "81927"        # @volwick.ita (Instagram italiano)
        nome: "@volwick.ita"
        timezone: Europe/Rome
        slots: {reel1: "15:00", carosello: "18:00", reel2: "20:00", reel3: "22:00", storia1: "10:30", storia2: "16:30", storia3: "20:00"}
      ig_us:
        platform: instagram
        dal: "2026-11-26"          # Power, 25/11 00:15: Instagram USA riparte con l'inglese che approva, dalle uscite del 26 novembre (prima: in pausa dal 23/11)
        blotato_id: "88316"        # @volwick.officiall (Instagram USA, AdsPower)
        nome: "@volwick.officiall"
        timezone: America/New_York
        slots: {carosello: "09:30", reel1: "12:30", reel2: "18:30", reel3: "21:30", storia1: "09:00", storia2: "14:00", storia3: "20:30"}
      tiktok:
        platform: tiktok
        dal: "2026-11-26"          # Power, 25/11 00:15: «i tik tok italiani vanno usati per lingua ita per ora»: contenuti italiani, dal 26 novembre
        blotato_id: "66374"        # @volwick.official (TikTok, per ora in italiano)
        nome: "TikTok @volwick.official"
