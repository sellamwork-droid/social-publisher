name: Pubblicazione social (AXUX + VOLWICK)

on:
  schedule:
    - cron: "*/15 * * * *"   # ogni 15 minuti: le conferme dal portale escono in fretta (repository pubblico: minuti gratuiti)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Solo prova (non carica e non programma nulla)"
        type: boolean
        default: true
      annulla:
        description: "Togli dai programmati questo contenuto (ID, es. A0002)"
        type: string
        default: ""
      simula_data:
        description: "Fingi che sia questa data/ora UTC (es. 2026-12-30T08:00:00): prende i pacchetti di quei giorni. Vuoto = adesso"
        type: string
        default: ""

concurrency:
  group: publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install -q -r requirements.txt
      - name: Pubblica
        env:
          BLOTATO_API_KEY: ${{ secrets.BLOTATO_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DRIVE_INBOX_FOLDER_ID: ${{ secrets.DRIVE_INBOX_FOLDER_ID }}
          DRIVE_PUBLISHED_FOLDER_ID: ${{ secrets.DRIVE_PUBLISHED_FOLDER_ID }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          BRAIN_TOKEN: ${{ secrets.BRAIN_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          ARGS=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="--dry-run"; fi
            if [ -n "${{ inputs.simula_data }}" ]; then ARGS="$ARGS --now ${{ inputs.simula_data }}"; fi
            if [ -n "${{ inputs.annulla }}" ]; then ARGS="$ARGS --annulla ${{ inputs.annulla }}"; fi
          fi
          python publish.py $ARGS
