name: Pubblicazione social (AXUX + VOLWICK)

on:
  schedule:
    - cron: "17 */3 * * *"   # ogni 3 ore (risparmia i minuti gratuiti di GitHub Actions)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Solo prova (non carica e non programma nulla)"
        type: boolean
        default: true

concurrency:
  group: publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install -q -r requirements.txt
      - name: Pubblica
        env:
          BLOTATO_API_KEY: ${{ secrets.BLOTATO_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DRIVE_INBOX_FOLDER_ID: ${{ secrets.DRIVE_INBOX_FOLDER_ID }}
          DRIVE_PUBLISHED_FOLDER_ID: ${{ secrets.DRIVE_PUBLISHED_FOLDER_ID }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            python publish.py --dry-run
          else
            python publish.py
          fi
